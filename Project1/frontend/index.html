<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>MedRAG</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Sidebar navigation">
        <div class="sidebar-top">
          <button class="brand-button" type="button" aria-label="Open menu">
            <span class="brand-mark">M</span>
          </button>
          <button class="icon-button" id="collapse-sidebar" type="button" aria-label="Collapse sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
        </div>

        <nav class="primary-nav" aria-label="Primary">
          <button class="nav-item active" type="button" data-action="new-chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            <span>New chat</span>
          </button>
          <button class="nav-item" type="button" data-action="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" /><path d="m16 16 4 4" /></svg>
            <span>Search chats</span>
          </button>
          <button class="nav-item" type="button" data-action="knowledge">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z" /><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20" /></svg>
            <span>Knowledge base</span>
          </button>
          <button class="nav-item" type="button" data-action="history">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.34-5.66L4 8.67" /><path d="M4 4v4.67h4.67M12 7v5l3 2" /></svg>
            <span>Recent chats</span>
          </button>
        </nav>

        <div class="sidebar-spacer"></div>
        <nav class="secondary-nav" aria-label="Secondary">
          <button class="nav-item" type="button" data-action="pricing">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 7v10M15 9.25c-.65-.7-1.6-1.1-2.75-1.1-1.35 0-2.25.66-2.25 1.65 0 2.45 5 1.02 5 3.7 0 1-.9 1.65-2.35 1.65-1.15 0-2.15-.4-2.85-1.15" /></svg>
            <span>Plans and pricing</span>
          </button>
          <button class="nav-item" type="button" data-action="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" /><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 1 1-2.4-2.4l.1-.1A1.7 1.7 0 0 0 6.2 12a1.7 1.7 0 0 0-1.2-2.9h-.2a1.7 1.7 0 0 1 0-3.4H5a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 1 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V1a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 1 1 2.4 2.4l-.1.1A1.7 1.7 0 0 0 19 7.7a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-.8 3Z" /></svg>
            <span>Settings</span>
          </button>
          <button class="nav-item" type="button" data-action="help">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M9.8 9.2a2.3 2.3 0 1 1 3.97 1.6c-.95.9-1.77 1.35-1.77 2.7M12 16.5h.01" /></svg>
            <span>Help</span>
          </button>
        </nav>
        <div class="account-card">
          <strong>Get responses tailored to you</strong>
          <p>Log in to get answers based on saved chats, plus create images and upload files.</p>
          <button class="login-button" type="button">Log in</button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="mobile-menu icon-button" id="mobile-menu" type="button" aria-label="Open sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          <button class="model-picker" type="button" aria-label="Choose model">
            <span>MedRAG</span><span class="chevron">⌄</span>
          </button>
          <div class="topbar-actions">
            <button class="topbar-button" type="button">Log in</button>
            <button class="topbar-button filled" type="button">Sign up for free</button>
          </div>
        </header>

        <section class="conversation" id="conversation" aria-live="polite">
          <div class="welcome" id="welcome">
            <h1>Where should we begin?</h1>
            <p>Ask about your medical knowledge base.</p>
          </div>
          <div class="messages" id="messages"></div>
        </section>

        <section class="composer-wrap">
          <form class="composer" id="chat-form">
            <input id="file-input" type="file" hidden multiple />
            <button class="composer-icon" id="attach-button" type="button" aria-label="Attach files">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20.5 11.5-7.8 7.8a5 5 0 0 1-7.1-7.1l8.1-8.1a3.5 3.5 0 0 1 5 5l-8.1 8.1a2 2 0 0 1-2.8-2.8l7.3-7.3" /></svg>
            </button>
            <textarea id="message-input" rows="1" placeholder="Ask anything" aria-label="Message"></textarea>
            <button class="voice-button" id="voice-button" type="button" aria-label="Voice input">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 0 0 3.5-3.5V7a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Z" /><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6" /></svg>
              <span>Voice</span>
            </button>
            <button class="send-button" id="send-button" type="submit" aria-label="Send message" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-3.5 14-3.2-5.2L5 12Z" /><path d="m12.3 13.8 3.9-4" /></svg>
            </button>
          </form>
          <div class="attachment-list" id="attachment-list"></div>
          <p class="disclaimer">By messaging MedRAG, you agree to our <a href="#">Terms</a> and have read our <a href="#">Privacy Policy</a>.</p>
        </section>
      </main>
    </div>
    <script src="./app.js" defer></script>
  </body>
</html>
